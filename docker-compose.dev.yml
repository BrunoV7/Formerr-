# =============================================================================
# Docker Compose Override for Development
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

version: '3.8'

services:
  # Development overrides for frontend
  frontend:
    environment:
      NODE_ENV: development
    volumes:
      - ./formerr-frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development overrides for backend (if needed)
  backend:
    environment:
      ENVIRONMENT: development
    volumes:
      - ./Formerr-FastAPI:/app
