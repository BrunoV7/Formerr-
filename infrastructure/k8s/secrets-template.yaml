apiVersion: v1
kind: Secret
metadata:
  name: formerr-secrets
  namespace: formerr
type: Opaque
stringData:
  # Database
  database-url: "DATABASE_URL_PLACEHOLDER"
  postgres-password: "POSTGRES_PASSWORD_PLACEHOLDER"
  
  # Authentication  
  jwt-secret: "JWT_SECRET_PLACEHOLDER"
  session-secret: "SESSION_SECRET_PLACEHOLDER"
  
  # GitHub OAuth
  github-client-id: "GITHUB_CLIENT_ID_PLACEHOLDER"
  github-client-secret: "GITHUB_CLIENT_SECRET_PLACEHOLDER"
  
  # Frontend URLs
  frontend-success-url: "FRONTEND_SUCCESS_URL_PLACEHOLDER"
  frontend-error-url: "FRONTEND_ERROR_URL_PLACEHOLDER"
  oauth-callback-url: "OAUTH_CALLBACK_URL_PLACEHOLDER"
