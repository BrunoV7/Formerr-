apiVersion: apps/v1
kind: Deployment
metadata:
  name: formerr-frontend
  namespace: formerr
  labels:
    app: formerr-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: formerr-frontend
  template:
    metadata:
      labels:
        app: formerr-frontend
    spec:
      containers:
      - name: frontend
        image: formerr-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://formerr-backend-service:8000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: formerr-frontend-service
  namespace: formerr
spec:
  selector:
    app: formerr-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
