# Staging Ingress with SSL/TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: formerr-staging-ingress
  namespace: formerr
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # CORS Headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://staging.formerr.tech,https://staging-api.formerr.tech"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  tls:
  - hosts:
    - staging.formerr.tech
    - staging-api.formerr.tech
    secretName: formerr-staging-tls-secret
  rules:
  # Frontend routes
  - host: staging.formerr.tech
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: formerr-frontend-service
            port:
              number: 3000
  # API routes
  - host: staging-api.formerr.tech
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: formerr-backend-service
            port:
              number: 8000
