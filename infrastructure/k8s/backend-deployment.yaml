apiVersion: apps/v1
kind: Deployment
metadata:
  name: formerr-backend
  namespace: formerr
  labels:
    app: formerr-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: formerr-backend
  template:
    metadata:
      labels:
        app: formerr-backend
    spec:
      containers:
      - name: backend
        image: formerr-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: database-url
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "formerr_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: postgres-password
        - name: DB_NAME
          value: "formerr_db"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: jwt-secret
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: session-secret
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: github-client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: github-client-secret
        - name: FRONTEND_SUCCESS_URL
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: frontend-success-url
        - name: FRONTEND_ERROR_URL
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: frontend-error-url
        - name: OAUTH_CALLBACK_URL
          valueFrom:
            secretKeyRef:
              name: formerr-secrets
              key: oauth-callback-url
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: formerr-backend-service
  namespace: formerr
spec:
  selector:
    app: formerr-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
