# Locust configuration file for Formerr load testing

# Basic settings
host = https://formerr.example.com
users = 50
spawn-rate = 5
run-time = 300s

# Advanced settings
headless = false
web-host = 0.0.0.0
web-port = 8089

# Logging
loglevel = INFO
logfile = logs/locust.log

# Results
html = reports/load_test_report.html
csv = reports/load_test
csv-full-history = true

# Tags and scenarios
tags = api,frontend
exclude-tags = slow

# Distributed testing (if running multiple workers)
# master = true
# expect-workers = 4
