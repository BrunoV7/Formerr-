name: Deploy Application - Staging

"on":
  push:
    branches: [develop]
    paths:
      - 'Formerr-FastAPI/**'
      - 'formerr-frontend/**'
      - 'infrastructure/k8s/**'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REPO_NAME: formerr

jobs:
  deploy-infra:
    name: Deploy Infrastructure First
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./infrastructure/terraform/staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.6.0'
    
    - name: Terraform Init
      run: terraform init
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_STAGING }}
    
    - name: Terraform Apply
      run: terraform apply -auto-approve -var="do_token=${{ secrets.DO_TOKEN_STAGING }}"
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_STAGING }}
    
    - name: Get cluster credentials
      id: get-credentials
      run: |
        echo "CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
        echo "CLUSTER_TOKEN=$(terraform output -raw cluster_token)" >> $GITHUB_OUTPUT
        echo "CLUSTER_CA=$(terraform output -raw cluster_ca_certificate)" >> $GITHUB_OUTPUT
    
    outputs:
      cluster_endpoint: ${{ steps.get-credentials.outputs.CLUSTER_ENDPOINT }}
      cluster_token: ${{ steps.get-credentials.outputs.CLUSTER_TOKEN }}
      cluster_ca: ${{ steps.get-credentials.outputs.CLUSTER_CA }}

  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    needs: deploy-infra
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DO_TOKEN_STAGING }}
    
    - name: Build Backend Image
      run: |
        docker build -t $REGISTRY/$REPO_NAME/formerr-backend:staging-$GITHUB_SHA ./Formerr-FastAPI
        docker tag $REGISTRY/$REPO_NAME/formerr-backend:staging-$GITHUB_SHA $REGISTRY/$REPO_NAME/formerr-backend:staging-latest
    
    - name: Build Frontend Image
      run: |
        docker build -t $REGISTRY/$REPO_NAME/formerr-frontend:staging-$GITHUB_SHA ./formerr-frontend
        docker tag $REGISTRY/$REPO_NAME/formerr-frontend:staging-$GITHUB_SHA $REGISTRY/$REPO_NAME/formerr-frontend:staging-latest
    
    - name: Log in to DigitalOcean Container Registry
      run: doctl registry login --expiry-seconds 1200
    
    - name: Push Backend Image
      run: |
        docker push $REGISTRY/$REPO_NAME/formerr-backend:staging-$GITHUB_SHA
        docker push $REGISTRY/$REPO_NAME/formerr-backend:staging-latest
    
    - name: Push Frontend Image
      run: |
        docker push $REGISTRY/$REPO_NAME/formerr-frontend:staging-$GITHUB_SHA
        docker push $REGISTRY/$REPO_NAME/formerr-frontend:staging-latest
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ needs.deploy-infra.outputs.cluster_ca }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster staging-cluster \
          --server=${{ needs.deploy-infra.outputs.cluster_endpoint }} \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials staging-user \
          --token=${{ needs.deploy-infra.outputs.cluster_token }}
        kubectl config set-context staging-context \
          --cluster=staging-cluster \
          --user=staging-user \
          --namespace=formerr
        kubectl config use-context staging-context
    
    - name: Deploy to Kubernetes
      run: |
        # Generate random passwords if not provided
        POSTGRES_PASS="${{ secrets.POSTGRES_PASSWORD || 'formerr_staging_pass_2024' }}"
        JWT_SECRET="${{ secrets.JWT_SECRET || 'staging-jwt-secret-key-2024-super-secure' }}"
        SESSION_SECRET="${{ secrets.SESSION_SECRET || 'staging-session-secret-2024-super-secure' }}"
        
        # Prepare secrets file
        cp infrastructure/k8s/secrets-template.yaml infrastructure/k8s/secrets-processed.yaml
        
        # Replace placeholders with actual values
        sed -i "s/POSTGRES_PASSWORD_PLACEHOLDER/${POSTGRES_PASS}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/JWT_SECRET_PLACEHOLDER/${JWT_SECRET}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/SESSION_SECRET_PLACEHOLDER/${SESSION_SECRET}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/GITHUB_CLIENT_ID_PLACEHOLDER/${{ secrets.CLIENT_ID || 'your-github-client-id' }}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/GITHUB_CLIENT_SECRET_PLACEHOLDER/${{ secrets.CLIENT_SECRET || 'your-github-client-secret' }}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/FRONTEND_SUCCESS_URL_PLACEHOLDER/http:\/\/staging-frontend\/auth\/success/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/FRONTEND_ERROR_URL_PLACEHOLDER/http:\/\/staging-frontend\/auth\/error/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/OAUTH_CALLBACK_URL_PLACEHOLDER/http:\/\/staging-backend\/auth\/github\/callback/g" infrastructure/k8s/secrets-processed.yaml
        
        # Update database URL with actual password
        sed -i "s/postgresql+asyncpg:\/\/formerr_user:POSTGRES_PASSWORD_PLACEHOLDER@/postgresql+asyncpg:\/\/formerr_user:${POSTGRES_PASS}@/g" infrastructure/k8s/secrets-processed.yaml
        
        # Update image tags in deployments
        sed -i "s|formerr-backend:latest|$REGISTRY/$REPO_NAME/formerr-backend:staging-$GITHUB_SHA|g" infrastructure/k8s/backend-deployment.yaml
        sed -i "s|formerr-frontend:latest|$REGISTRY/$REPO_NAME/formerr-frontend:staging-$GITHUB_SHA|g" infrastructure/k8s/frontend-deployment.yaml
        
        # Apply manifests
        kubectl apply -f infrastructure/k8s/secrets-processed.yaml
        kubectl apply -f infrastructure/k8s/postgres-deployment.yaml
        kubectl apply -f infrastructure/k8s/backend-deployment.yaml
        kubectl apply -f infrastructure/k8s/frontend-deployment.yaml
    
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/formerr-backend -n formerr --timeout=300s
        kubectl rollout status deployment/formerr-frontend -n formerr --timeout=300s
    
    - name: Get service URLs
      run: |
        echo "🌐 STAGING URLS:"
        echo "Frontend: http://$(kubectl get svc formerr-frontend-service -n formerr -o jsonpath='{.status.loadBalancer.ingress[0].ip}'):3000"
        echo "Backend: http://$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}'):8000"
        echo ""
        echo "� Load Balancer IP:"
        kubectl get svc -n formerr -o wide
