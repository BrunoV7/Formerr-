name: Deploy Infrastructure (DigitalOcean)

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'k8s/infrastructure/**'
      - 'scripts/smart-deploy.sh'
      - 'scripts/validate-terraform.sh'
      - 'scripts/install-simple-infrastructure-no-traefik.sh'
      - 'scripts/clean-orphaned-webhooks.sh'
      - 'scripts/install-simple-monitoring.sh'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: formerr-registry
  CLUSTER_NAME: formerr-production-cluster

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    outputs:
      registry_endpoint: ${{ steps.infra-output.outputs.registry_endpoint }}
      cluster_name: ${{ steps.infra-output.outputs.cluster_name }}
      vpc_id: ${{ steps.infra-output.outputs.vpc_id }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DO_TOKEN_PROD }}

    # Get available Kubernetes versions first
    - name: Get Available Kubernetes Versions
      run: |
        echo "Available Kubernetes versions:"
        doctl kubernetes options versions
        echo "Latest version:"
        doctl kubernetes options versions --output json | jq -r '.[0].slug'

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.33.0'  # Updated to match cluster version 1.33.1

    # Infrastructure Detection and Deployment
    - name: Detect Existing Resources and Deploy Infrastructure
      run: |
        # Make scripts executable
        chmod +x scripts/smart-deploy.sh scripts/validate-terraform.sh
        
        # Validate Terraform configuration first
        ./scripts/validate-terraform.sh
        
        # Set environment variables for production deployment
        export DO_TOKEN_PROD="${{ secrets.DO_TOKEN_PROD }}"
        export GITHUB_CLIENT_ID="${{ secrets.CLIENT_ID }}"
        export GITHUB_CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
        export DATABASE_URL="${{ secrets.DATABASE_URL }}"
        export DB_HOST="${{ secrets.DB_HOST }}"
        export DB_PORT="${{ secrets.DB_PORT }}"
        export DB_NAME="${{ secrets.DB_NAME }}"
        export DB_USER="${{ secrets.DB_USER }}"
        export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
        export SKIP_CONFIRM=1
        
        # Run smart deployment for production
        ./scripts/smart-deploy.sh production formerr-registry

    # Configure kubectl
    - name: Configure kubectl for Production Cluster
      run: |
        # Get cluster name from Terraform output
        cd infrastructure/digitalocean-production
        CLUSTER_NAME=$(terraform output -raw cluster_name)
        echo "Configuring kubectl for cluster: $CLUSTER_NAME"
        doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
        
        # Verify cluster connection
        kubectl cluster-info
        kubectl get nodes

    # Smart Infrastructure Installation (only installs what's missing)
    - name: Install Simple Infrastructure (No Traefik)
      run: |
        # Make scripts executable
        chmod +x scripts/install-simple-infrastructure-no-traefik.sh
        chmod +x scripts/clean-orphaned-webhooks.sh
        
        # Clean orphaned webhooks first
        ./scripts/clean-orphaned-webhooks.sh
        
        # Install simple infrastructure (no Traefik)
        ./scripts/install-simple-infrastructure-no-traefik.sh

    # Configure Database Access
    - name: Configure Database Network Access
      run: |
        echo "🔗 Configuring database network access..."
        
        # Get cluster VPC ID
        cd infrastructure/digitalocean-production
        CLUSTER_VPC_ID=$(terraform output -raw vpc_id)
        cd ../..
        
        echo "Cluster VPC ID: $CLUSTER_VPC_ID"
        
        # Get the database ID by name
        echo "🔍 Finding database by name..."
        DB_ID=$(doctl databases list --output json | jq -r '.[] | select(.name == "db-postgresql-nyc1-67289") | .id')
        
        if [ -z "$DB_ID" ]; then
          echo "❌ Database db-postgresql-nyc1-67289 not found!"
          echo "📋 Available databases:"
          doctl databases list
          exit 1
        fi
        
        echo "✅ Database found! ID: $DB_ID"
        
        # Debug: Check current firewall structure
        echo "🔍 Current firewall rules structure:"
        doctl databases firewalls list "$DB_ID" --output json
        
        # Get current firewall rules - handle both possible response formats
        CURRENT_RULES=$(doctl databases firewalls list "$DB_ID" --output json)
        
        # Get the Kubernetes cluster ID (not VPC ID) for database firewall
        CLUSTER_ID=$(doctl kubernetes clusters list --output json | jq -r '.[] | select(.name == "formerr-production-cluster") | .id')
        
        if [ -z "$CLUSTER_ID" ]; then
          echo "❌ Could not find Kubernetes cluster ID"
          exit 1
        fi
        
        echo "Kubernetes Cluster ID: $CLUSTER_ID"
        
        # Check if cluster is already in firewall rules (looking for k8s type rules)
        if echo "$CURRENT_RULES" | jq -r '.[] | select(.type == "k8s") | .value' 2>/dev/null | grep -q "$CLUSTER_ID"; then
          echo "✅ Database already allows connections from Kubernetes cluster"
        else
          echo "📝 Adding Kubernetes cluster to database firewall..."
          
          # Add the Kubernetes cluster to firewall rules
          if doctl databases firewalls append "$DB_ID" --rule k8s:$CLUSTER_ID; then
            echo "✅ VPC rule added successfully"
            
            # Give it a moment to apply
            sleep 15
            
            # Verify the rule was added
            echo "🔍 Verifying rule was applied..."
            UPDATED_RULES=$(doctl databases firewalls list "$DB_ID" --output json)
            echo "Updated firewall rules:"
            echo "$UPDATED_RULES"
            
            if echo "$UPDATED_RULES" | jq -r '.[] | select(.type == "k8s") | .value' 2>/dev/null | grep -q "$CLUSTER_ID"; then
              echo "✅ Database network access configured successfully"
            else
              echo "⚠️ Warning: Could not verify database firewall rule was added, but command succeeded"
            fi
          else
            echo "❌ Failed to add Kubernetes cluster to database firewall"
            exit 1
          fi
        fi

    # Deploy Security and Monitoring
    - name: Deploy Security Policies
      run: |
        kubectl apply -f k8s/security/network-policies.yaml

    - name: Deploy Application Monitoring (Simple Stack)
      run: |
        # Use simple monitoring stack that doesn't require Prometheus Operator
        chmod +x scripts/install-simple-monitoring.sh
        ./scripts/install-simple-monitoring.sh

    - name: Deploy Resource Limits
      run: |
        # Deploy resource quotas and limits (no autoscaling for free tier)
        kubectl apply -f k8s/autoscaling/resource-limits.yaml

    # Deploy Ingress (Simplified - No LoadBalancer needed)
    - name: Deploy Ingress
      run: |
        # Only deploy internal backend ingress (frontend has direct LoadBalancer)
        kubectl apply -f k8s/production/ingress-simple.yaml
        kubectl apply -f k8s/monitoring/monitoring-ingress.yaml

    # Output infrastructure information
    - name: Set Infrastructure Outputs
      id: infra-output
      run: |
        cd infrastructure/digitalocean-production
        echo "registry_endpoint=$(terraform output -raw registry_endpoint)" >> $GITHUB_OUTPUT
        echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
        echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT

    # Get Infrastructure Information
    - name: Get Infrastructure Information
      run: |
        echo "🏗️ === INFRASTRUCTURE DEPLOYMENT COMPLETED ==="
        echo ""
        echo "📊 MONITORING DASHBOARDS:"
        echo "   Prometheus: https://prometheus.formerr.tech"
        echo "   Grafana: https://grafana.formerr.tech"
        echo "   Auth: admin / admin123"
        echo ""
        echo "🌐 NGINX INGRESS CONTROLLER (For monitoring only):"
        LB_IP=$(kubectl get service ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "Pending...")
        echo "   IP: $LB_IP"
        echo ""
        echo "⚠️ IMPORTANT DNS CONFIGURATION:"
        echo "   A    prometheus.formerr.tech -> $LB_IP (Monitoring)"
        echo "   A    grafana.formerr.tech   -> $LB_IP (Monitoring)"
        echo ""
        echo "✅ Infrastructure is ready for application deployment!"