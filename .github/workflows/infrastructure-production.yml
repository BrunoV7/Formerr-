name: 🏗️ Infraestrutura - Produção

on:
  workflow_call:
    inputs:
      force_deploy:
        description: 'Forçar deploy mesmo sem mudanças'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/production/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forçar deploy mesmo sem mudanças'
        required: false
        type: boolean
        default: false

env:
  TF_VERSION: '1.6.0'
  ENVIRONMENT: 'production'

jobs:
  validate-terraform:
    name: 🔍 Validar Terraform
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./infrastructure/terraform/production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check
    
    - name: Terraform Init
      run: terraform init
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_PROD }}
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Security Scan
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ./infrastructure/terraform/production
        format: sarif
        out: tfsec.sarif
    
    - name: Upload TFsec results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: tfsec.sarif

  deploy-infrastructure:
    name: 🚀 Deploy Infraestrutura
    runs-on: ubuntu-latest
    needs: validate-terraform
    if: github.event.inputs.force_deploy == 'true' || contains(github.event.head_commit.modified, 'infrastructure/terraform/production/') || github.event_name == 'workflow_dispatch'
    
    defaults:
      run:
        working-directory: ./infrastructure/terraform/production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Cache Terraform
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-terraform-${{ hashFiles('infrastructure/terraform/production/**/*.tf') }}
        restore-keys: |
          ${{ runner.os }}-terraform-
    
    - name: Terraform Init
      run: terraform init
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_PROD }}
    
    - name: Terraform Plan
      id: plan
      run: terraform plan -var="do_token=${{ secrets.DO_TOKEN_PROD }}" -out=tfplan
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_PROD }}
    
    - name: Terraform Apply
      run: terraform apply tfplan
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_PROD }}
    
    - name: Save Terraform Outputs
      run: |
        echo "CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint)" >> $GITHUB_ENV
        echo "CLUSTER_ID=$(terraform output -raw cluster_id)" >> $GITHUB_ENV
        terraform output -raw cluster_token > cluster_token.txt
        terraform output -raw cluster_ca_certificate > cluster_ca.txt
    
    - name: Upload cluster credentials
      uses: actions/upload-artifact@v4
      with:
        name: production-cluster-credentials
        path: |
          infrastructure/terraform/production/cluster_token.txt
          infrastructure/terraform/production/cluster_ca.txt
        retention-days: 30

  install-monitoring:
    name: 📊 Instalar Monitoramento
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: always() && needs.deploy-infrastructure.result == 'success'
    
    defaults:
      run:
        working-directory: ./infrastructure/terraform/production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: production-cluster-credentials
        path: ./credentials
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ needs.deploy-infrastructure.outputs.cluster_ca }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster production-cluster \
          --server=${{ needs.deploy-infrastructure.outputs.cluster_endpoint }} \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials production-user \
          --token=${{ needs.deploy-infrastructure.outputs.cluster_token }}
        kubectl config set-context production-context \
          --cluster=production-cluster \
          --user=production-user \
          --namespace=monitoring
        kubectl config use-context production-context
    
    - name: Install Prometheus Stack
      run: |
        # Add Prometheus Helm repository
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
        
        # Install Prometheus Stack
        helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
          --namespace monitoring \
          --create-namespace \
          --values prometheus-values.yaml \
          --wait \
          --timeout 10m
    
    - name: Verify monitoring installation
      run: |
        echo "🔍 Verificando instalação do monitoramento..."
        
        # Check Prometheus pods
        kubectl get pods -n monitoring -l app=prometheus
        kubectl get pods -n monitoring -l app=grafana
        
        # Check services
        kubectl get svc -n monitoring
        
        # Check if Prometheus is accessible
        PROMETHEUS_POD=$(kubectl get pods -n monitoring -l app=prometheus -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        if [ -n "$PROMETHEUS_POD" ]; then
          echo "Prometheus pod: $PROMETHEUS_POD"
          kubectl port-forward -n monitoring $PROMETHEUS_POD 9090:9090 &
          PF_PID=$!
          sleep 10
          
          curl -f -s -o /dev/null -w "Prometheus Status: %{http_code}\n" http://localhost:9090/api/v1/status/config || echo "Prometheus not accessible"
          
          kill $PF_PID 2>/dev/null || true
        fi

  security-scan:
    name: 🔒 Escaneamento de Segurança
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: always() && needs.deploy-infrastructure.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: production-cluster-credentials
        path: ./credentials
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ needs.deploy-infrastructure.outputs.cluster_ca }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster production-cluster \
          --server=${{ needs.deploy-infrastructure.outputs.cluster_endpoint }} \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials production-user \
          --token=${{ needs.deploy-infrastructure.outputs.cluster_token }}
        kubectl config set-context production-context \
          --cluster=production-cluster \
          --user=production-user
        kubectl config use-context production-context
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

  generate-report:
    name: 📋 Gerar Relatório
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, install-monitoring, security-scan]
    if: always()
    
    steps:
    - name: Generate infrastructure report
      run: |
        echo "🏗️ Relatório de Infraestrutura - Produção"
        echo "=========================================="
        echo "Timestamp: $(date)"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        echo ""
        echo "Status dos Jobs:"
        echo "- Deploy Infrastructure: ${{ needs.deploy-infrastructure.result }}"
        echo "- Install Monitoring: ${{ needs.install-monitoring.result }}"
        echo "- Security Scan: ${{ needs.security-scan.result }}"
        echo ""
        
        if [ "${{ needs.deploy-infrastructure.result }}" == "success" ]; then
          echo "✅ Infraestrutura deployada com sucesso"
          echo "Cluster ID: ${{ needs.deploy-infrastructure.outputs.cluster_id }}"
          echo "Cluster Endpoint: ${{ needs.deploy-infrastructure.outputs.cluster_endpoint }}"
        else
          echo "❌ Falha no deploy da infraestrutura"
        fi
        
        if [ "${{ needs.install-monitoring.result }}" == "success" ]; then
          echo "✅ Monitoramento instalado com sucesso"
        else
          echo "⚠️ Monitoramento não instalado ou com falhas"
        fi
        
        if [ "${{ needs.security-scan.result }}" == "success" ]; then
          echo "✅ Escaneamento de segurança concluído"
        else
          echo "⚠️ Escaneamento de segurança com falhas"
        fi 