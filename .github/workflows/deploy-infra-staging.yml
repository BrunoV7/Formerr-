name: Deploy Infrastructure - Staging

"on":
  push:
    branches: [develop]
  workflow_dispatch:

env:
  TF_VERSION: '1.6.0'

jobs:
  terraform-staging:
    name: Deploy Staging Infrastructure
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./infrastructure/terraform/staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check
    
    - name: Terraform Init
      run: terraform init
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_STAGING }}
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: terraform plan -var="do_token=${{ secrets.DO_TOKEN_STAGING }}"
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_STAGING }}
    
    - name: Terraform Apply
      if: github.ref == 'refs/heads/develop'
      run: terraform apply -auto-approve -var="do_token=${{ secrets.DO_TOKEN_STAGING }}"
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN_STAGING }}
    
    - name: Save Terraform Outputs
      if: github.ref == 'refs/heads/develop'
      run: |
        echo "CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint)" >> $GITHUB_ENV
        echo "CLUSTER_ID=$(terraform output -raw cluster_id)" >> $GITHUB_ENV
        terraform output -raw cluster_token > cluster_token.txt
        terraform output -raw cluster_ca_certificate > cluster_ca.txt
    
    - name: Upload cluster credentials
      if: github.ref == 'refs/heads/develop'
      uses: actions/upload-artifact@v4
      with:
        name: staging-cluster-credentials
        path: |
          infrastructure/terraform/staging/cluster_token.txt
          infrastructure/terraform/staging/cluster_ca.txt
