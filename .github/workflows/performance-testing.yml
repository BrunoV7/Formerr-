name: Performance Testing

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      duration:
        description: 'Test duration in seconds'
        required: true
        default: '300'
      users:
        description: 'Number of concurrent users'
        required: true
        default: '50'

env:
  REGISTRY: registry.digitalocean.com

jobs:
  performance-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install locust requests

    - name: Get environment URL
      id: get-url
      run: |
        if [ "${{ github.event.inputs.environment || 'staging' }}" == "production" ]; then
          echo "target_url=https://formerr.example.com" >> $GITHUB_OUTPUT
        else
          echo "target_url=https://staging.formerr.example.com" >> $GITHUB_OUTPUT
        fi

    - name: Wait for environment to be ready
      run: |
        echo "Waiting for ${{ steps.get-url.outputs.target_url }} to be ready..."
        timeout 300 bash -c '
        while [[ "$(curl -s -o /dev/null -w %{http_code} ${{ steps.get-url.outputs.target_url }}/health)" != "200" ]]; do
          echo "Waiting for application to be ready..."
          sleep 10
        done'
        echo "✅ Environment is ready!"

    - name: Run performance test
      run: |
        # Create reports directory
        mkdir -p reports logs
        
        # Run load test
        locust \
          -f scripts/load_test.py \
          --host=${{ steps.get-url.outputs.target_url }} \
          --users=${{ github.event.inputs.users || 50 }} \
          --spawn-rate=5 \
          --run-time=${{ github.event.inputs.duration || 300 }}s \
          --headless \
          --html=reports/performance_report.html \
          --csv=reports/performance_test \
          --csv-full-history \
          --loglevel=INFO \
          --logfile=logs/performance.log

    - name: Analyze results
      run: |
        # Check if performance test passed based on metrics
        python3 -c "
        import csv
        import sys
        
        # Read performance metrics
        try:
            with open('reports/performance_test_stats.csv', 'r') as f:
                reader = csv.DictReader(f)
                for row in reader:
                    if row['Type'] == 'Aggregated':
                        avg_response = float(row['Average Response Time'])
                        failure_rate = float(row['Failure Count']) / (float(row['Request Count']) + float(row['Failure Count'])) * 100
                        
                        print(f'Average Response Time: {avg_response:.2f}ms')
                        print(f'Failure Rate: {failure_rate:.2f}%')
                        
                        # Define thresholds
                        if avg_response > 2000:  # 2 seconds
                            print('❌ FAIL: Average response time exceeds 2000ms')
                            sys.exit(1)
                        if failure_rate > 5:  # 5%
                            print('❌ FAIL: Failure rate exceeds 5%')
                            sys.exit(1)
                        
                        print('✅ PASS: Performance test passed')
                        break
        except Exception as e:
            print(f'Error analyzing results: {e}')
            sys.exit(1)
        "

    - name: Upload performance reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-reports-${{ github.event.inputs.environment || 'staging' }}
        path: |
          reports/
          logs/
        retention-days: 30

    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ Performance test failed! Please check the performance report in the workflow artifacts.'
          })

  lighthouse-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli

    - name: Get environment URL
      id: get-url
      run: |
        if [ "${{ github.event.inputs.environment || 'staging' }}" == "production" ]; then
          echo "target_url=https://formerr.example.com" >> $GITHUB_OUTPUT
        else
          echo "target_url=https://staging.formerr.example.com" >> $GITHUB_OUTPUT
        fi

    - name: Run Lighthouse audit
      run: |
        lhci autorun \
          --upload.target=filesystem \
          --upload.outputDir=./lighthouse-results \
          --collect.url="${{ steps.get-url.outputs.target_url }}" \
          --collect.url="${{ steps.get-url.outputs.target_url }}/dashboard" \
          --collect.url="${{ steps.get-url.outputs.target_url }}/login"

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lighthouse-results-${{ github.event.inputs.environment || 'staging' }}
        path: lighthouse-results/
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install OWASP ZAP
      run: |
        sudo snap install zaproxy --classic

    - name: Get environment URL
      id: get-url
      run: |
        if [ "${{ github.event.inputs.environment || 'staging' }}" == "production" ]; then
          echo "target_url=https://formerr.example.com" >> $GITHUB_OUTPUT
        else
          echo "target_url=https://staging.formerr.example.com" >> $GITHUB_OUTPUT
        fi

    - name: Run OWASP ZAP security scan
      run: |
        mkdir -p security-reports
        
        # Basic security scan (passive scan only for production)
        if [ "${{ github.event.inputs.environment || 'staging' }}" == "production" ]; then
          zap.sh -cmd -quickurl ${{ steps.get-url.outputs.target_url }} -quickout security-reports/zap-report.html
        else
          # More thorough scan for staging
          zap.sh -cmd -quickurl ${{ steps.get-url.outputs.target_url }} -quickprogress -quickout security-reports/zap-report.html
        fi

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ github.event.inputs.environment || 'staging' }}
        path: security-reports/
        retention-days: 30

  notify-results:
    runs-on: ubuntu-latest
    needs: [performance-test, lighthouse-audit, security-scan]
    if: always()
    
    steps:
    - name: Send notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          Performance Testing Results for ${{ github.event.inputs.environment || 'staging' }}:
          - Performance Test: ${{ needs.performance-test.result }}
          - Lighthouse Audit: ${{ needs.lighthouse-audit.result }}
          - Security Scan: ${{ needs.security-scan.result }}
          
          View detailed reports in workflow artifacts.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
