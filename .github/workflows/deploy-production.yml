name: Deploy to Production (DigitalOcean)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: formerr-registry
  CLUSTER_NAME: formerr-production-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DO_TOKEN_PROD }}

    # Get available Kubernetes versions first
    - name: Get Available Kubernetes Versions
      run: |
        echo "Available Kubernetes versions:"
        doctl kubernetes options versions
        echo "Latest version:"
        doctl kubernetes options versions --output json | jq -r '.[0].slug'

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.33.0'  # Updated to match cluster version 1.33.1

    # Infrastructure Detection and Deployment
    - name: Detect Existing Resources and Deploy Infrastructure
      run: |
        # Make scripts executable
        chmod +x scripts/smart-deploy.sh scripts/validate-terraform.sh
        
        # Validate Terraform configuration first
        ./scripts/validate-terraform.sh
        
        # Set environment variables for production deployment
        export DO_TOKEN_PROD="${{ secrets.DO_TOKEN_PROD }}"
        export GITHUB_CLIENT_ID="${{ secrets.CLIENT_ID }}"
        export GITHUB_CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
        export DATABASE_URL="${{ secrets.DATABASE_URL }}"
        export DB_HOST="${{ secrets.DB_HOST }}"
        export DB_PORT="${{ secrets.DB_PORT }}"
        export DB_NAME="${{ secrets.DB_NAME }}"
        export DB_USER="${{ secrets.DB_USER }}"
        export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
        export SKIP_CONFIRM=1
        
        # Run smart deployment for production
        ./scripts/smart-deploy.sh production formerr-registry

    # Configure kubectl
    - name: Configure kubectl for Production Cluster
      run: |
        # Get cluster name from Terraform output
        cd infrastructure/digitalocean-production
        CLUSTER_NAME=$(terraform output -raw cluster_name)
        echo "Configuring kubectl for cluster: $CLUSTER_NAME"
        doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
        
        # Verify cluster connection
        kubectl cluster-info
        kubectl get nodes

    # Install Traefik Ingress Controller
    - name: Install Traefik Ingress Controller with Let's Encrypt
      run: |
        # Make script executable and run Traefik installation
        chmod +x scripts/install-traefik.sh
        ./scripts/install-traefik.sh

    # Build and Push Backend
    - name: Build and Push Backend Image
      run: |
        # Get registry name from Terraform output
        REGISTRY_ENDPOINT=$(cd infrastructure/digitalocean-production && terraform output -raw registry_endpoint)
        
        # Log in to DigitalOcean Container Registry
        doctl registry login
        
        # Build backend image (from repo root)
        docker build -t ${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-backend:latest \
          ./Formerr-FastAPI
        
        # Push backend image
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:latest

    # Build and Push Frontend
    - name: Build and Push Frontend Image
      run: |
        # Get registry name from Terraform output
        REGISTRY_ENDPOINT=$(cd infrastructure/digitalocean-production && terraform output -raw registry_endpoint)
        
        # Build frontend image (from repo root)
        docker build -t ${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-frontend:latest \
          --build-arg NEXT_PUBLIC_API_URL=https://api.formerr.tech \
          ./formerr-frontend
        
        # Push frontend image
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:latest

    # Configure Database Access
    - name: Configure Database Network Access
      run: |
        echo "🔗 Configuring database network access..."
        
        # Get cluster VPC ID
        cd infrastructure/digitalocean-production
        CLUSTER_VPC_ID=$(terraform output -raw vpc_id)
        cd ../..
        
        echo "Cluster VPC ID: $CLUSTER_VPC_ID"
        
        # Get the database ID by name
        echo "🔍 Finding database by name..."
        DB_ID=$(doctl databases list --output json | jq -r '.[] | select(.name == "db-postgresql-nyc1-67289") | .id')
        
        if [ -z "$DB_ID" ]; then
          echo "❌ Database db-postgresql-nyc1-67289 not found!"
          echo "📋 Available databases:"
          doctl databases list
          exit 1
        fi
        
        echo "✅ Database found! ID: $DB_ID"
        
        # Debug: Check current firewall structure
        echo "🔍 Current firewall rules structure:"
        doctl databases firewalls list "$DB_ID" --output json
        
        # Get current firewall rules - handle both possible response formats
        CURRENT_RULES=$(doctl databases firewalls list "$DB_ID" --output json)
        
        # Get the Kubernetes cluster ID (not VPC ID) for database firewall
        CLUSTER_ID=$(doctl kubernetes clusters list --output json | jq -r '.[] | select(.name == "formerr-production-cluster") | .id')
        
        if [ -z "$CLUSTER_ID" ]; then
          echo "❌ Could not find Kubernetes cluster ID"
          exit 1
        fi
        
        echo "Kubernetes Cluster ID: $CLUSTER_ID"
        
        # Check if cluster is already in firewall rules (looking for k8s type rules)
        if echo "$CURRENT_RULES" | jq -r '.[] | select(.type == "k8s") | .value' 2>/dev/null | grep -q "$CLUSTER_ID"; then
          echo "✅ Database already allows connections from Kubernetes cluster"
        else
          echo "📝 Adding Kubernetes cluster to database firewall..."
          
          # Add the Kubernetes cluster to firewall rules
          if doctl databases firewalls append "$DB_ID" --rule k8s:$CLUSTER_ID; then
            echo "✅ VPC rule added successfully"
            
            # Give it a moment to apply
            sleep 15
            
            # Verify the rule was added
            echo "🔍 Verifying rule was applied..."
            UPDATED_RULES=$(doctl databases firewalls list "$DB_ID" --output json)
            echo "Updated firewall rules:"
            echo "$UPDATED_RULES"
            
            if echo "$UPDATED_RULES" | jq -r '.[] | select(.type == "k8s") | .value' 2>/dev/null | grep -q "$CLUSTER_ID"; then
              echo "✅ Database network access configured successfully"
            else
              echo "⚠️ Warning: Could not verify database firewall rule was added, but command succeeded"
            fi
          else
            echo "❌ Failed to add Kubernetes cluster to database firewall"
            exit 1
          fi
        fi

    # Deploy Application Secrets
    - name: Deploy Application Secrets
      run: |
        # Create namespace if not exists
        kubectl create namespace formerr --dry-run=client -o yaml | kubectl apply -f -
        
        # Create application secrets
        kubectl create secret generic formerr-app-secret \
          --namespace=formerr \
          --from-literal=GITHUB_CLIENT_ID="${{ secrets.CLIENT_ID }}" \
          --from-literal=GITHUB_CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --from-literal=SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    # Deploy Application
    - name: Deploy Backend
      run: |
        # Get registry endpoint from Terraform output
        cd infrastructure/digitalocean-production
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        cd ../..
        
        # Update image tags in deployment
        sed -i "s|registry.digitalocean.com/formerr-production/formerr-backend:latest|${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }}|g" k8s/production/backend-deployment.yaml
        kubectl apply -f k8s/production/backend-deployment.yaml

    - name: Deploy Frontend
      run: |
        # Get registry endpoint from Terraform output
        cd infrastructure/digitalocean-production
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        cd ../..
        
        # Update image tags in deployment
        sed -i "s|registry.digitalocean.com/formerr-production/formerr-frontend:latest|${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }}|g" k8s/production/frontend-deployment.yaml
        kubectl apply -f k8s/production/frontend-deployment.yaml

    # Deploy Security and Monitoring
    - name: Deploy Security Policies
      run: |
        kubectl apply -f k8s/security/network-policies.yaml

    - name: Deploy Application Monitoring
      run: |
        kubectl apply -f k8s/monitoring/app-monitoring.yaml

    - name: Deploy Resource Limits
      run: |
        # Deploy resource quotas and limits (no autoscaling for free tier)
        kubectl apply -f k8s/autoscaling/resource-limits.yaml

    # Deploy Ingress
    - name: Deploy Ingress
      run: |
        kubectl apply -f k8s/production/ingress.yaml
        kubectl apply -f k8s/monitoring/monitoring-ingress.yaml

    # Deploy Monitoring
    - name: Deploy Monitoring
      run: |
        echo "📊 Deploying Prometheus and Grafana monitoring..."
        
        # Clean up any existing Helm releases (idempotent)
        if command -v helm &> /dev/null; then
          echo "🧹 Cleaning up any existing Helm releases..."
          helm uninstall prometheus -n monitoring 2>/dev/null || true
          helm uninstall kube-prometheus-stack -n monitoring 2>/dev/null || true
          helm uninstall grafana -n monitoring 2>/dev/null || true
        fi
        
        # Deploy Prometheus and Grafana using manifests
        kubectl apply -f k8s/monitoring/prometheus-simple.yaml
        
        # Wait for monitoring to be ready
        echo "⏳ Waiting for Prometheus deployment to be ready..."
        kubectl wait --for=condition=available deployment/prometheus -n monitoring --timeout=300s
        
        echo "⏳ Waiting for Grafana deployment to be ready..."
        kubectl wait --for=condition=available deployment/grafana -n monitoring --timeout=300s
        
        # Additional check: wait for pods to be ready
        echo "⏳ Waiting for Prometheus pods to be ready..."
        kubectl wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=300s
        
        echo "⏳ Waiting for Grafana pods to be ready..."
        kubectl wait --for=condition=ready pod -l app=grafana -n monitoring --timeout=300s
        
        echo "✅ Prometheus and Grafana monitoring deployed successfully"

    # Wait for deployment
    - name: Wait for Deployment
      run: |
        kubectl rollout status deployment/formerr-backend -n formerr --timeout=600s
        kubectl rollout status deployment/formerr-frontend -n formerr --timeout=600s

    # Validate Deployment
    - name: Validate Deployment
      run: |
        echo "🔍 Validating deployment status..."
        
        # Check if pods are running
        echo "📦 Checking application pods:"
        kubectl get pods -n formerr
        
        # Check services
        echo "🌐 Checking services:"
        kubectl get services -n formerr
        
        # Check ingress
        echo "🔗 Checking ingress:"
        kubectl get ingress -n formerr
        
        # Check monitoring
        echo "📊 Monitoring Status:"
        kubectl get pods -n monitoring
        kubectl get services -n monitoring
        
        # Wait a bit for pods to start if they're still pending
        echo "⏳ Giving pods time to start..."
        sleep 30
        
        # Check backend health (internal) - with retry
        echo "🏥 Checking backend health..."
        for i in {1..5}; do
          if kubectl exec -n formerr deployment/formerr-backend -- curl -f http://localhost:8000/health 2>/dev/null; then
            echo "✅ Backend health check passed"
            break
          else
            echo "⏳ Backend not ready yet, attempt $i/5..."
            sleep 10
          fi
        done
        
        echo "✅ Production deployment validation completed!"

    # Get Access Information
    - name: Get Access Information
      run: |
        echo "🌐 === FORMERR ACCESS INFORMATION ==="
        echo ""
        echo "📱 MAIN APPLICATION:"
        echo "   URL: https://formerr.tech"
        echo "   Port: 443 (HTTPS)"
        echo ""
        echo "🔌 API BACKEND:"
        echo "   URL: https://api.formerr.tech"
        echo "   Port: 443 (HTTPS)"
        echo ""
        echo "📊 MONITORING DASHBOARDS:"
        echo "   Prometheus: https://prometheus.formerr.tech"
        echo "   Grafana: https://grafana.formerr.tech"
        echo "   Port: 443 (HTTPS)"
        echo "   Auth: admin / admin123"
        echo ""
        echo "� Load Balancer IP:"
        LB_IP=$(kubectl get service ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "Pending...")
        echo "   $LB_IP"
        echo ""
        echo "⚠️ IMPORTANT: Configure your DNS records:"
        echo "   A    formerr.tech           -> $LB_IP"
        echo "   A    api.formerr.tech       -> $LB_IP"
        echo "   A    prometheus.formerr.tech -> $LB_IP"
        echo "   A    grafana.formerr.tech   -> $LB_IP"