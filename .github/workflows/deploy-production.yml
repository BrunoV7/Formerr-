name: Deploy to Production (DigitalOcean)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: formerr-registry
  CLUSTER_NAME: formerr-production-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DO_TOKEN_PROD }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    # Infrastructure Detection and Deployment
    - name: Detect Existing Resources and Deploy Infrastructure
      run: |
        # Make scripts executable
        chmod +x scripts/smart-deploy.sh scripts/validate-terraform.sh
        
        # Validate Terraform configuration first
        ./scripts/validate-terraform.sh
        
        # Set environment variables for production deployment
        export DO_TOKEN_PROD="${{ secrets.DO_TOKEN_PROD }}"
        export GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}"
        export GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
        export DATABASE_URL="${{ secrets.DATABASE_URL }}"
        export DB_HOST="${{ secrets.DB_HOST }}"
        export DB_PORT="${{ secrets.DB_PORT }}"
        export DB_NAME="${{ secrets.DB_NAME }}"
        export DB_USER="${{ secrets.DB_USER }}"
        export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
        export SKIP_CONFIRM=1
        
        # Run smart deployment for production
        ./scripts/smart-deploy.sh production formerr-registry

    # Configure kubectl
    - name: Configure kubectl for Production Cluster
      run: |
        # Get cluster name from Terraform output
        cd infrastructure/digitalocean-production
        CLUSTER_NAME=$(terraform output -raw cluster_name)
        doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

    # Install Ingress and Cert-Manager
    - name: Install Ingress Controller and Cert-Manager
      run: |
        # Install NGINX Ingress Controller
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/do/deploy.yaml
        
        # Wait for ingress controller to be ready
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s
        
        # Install cert-manager
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.2/cert-manager.yaml
        
        # Wait for cert-manager to be ready
        kubectl wait --namespace cert-manager \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s
        
        # Apply cluster issuers
        kubectl apply -f k8s/monitoring/ingress-cert-manager.yaml

    # Build and Push Backend
    - name: Build and Push Backend Image
      run: |
        # Get registry name from Terraform output
        cd infrastructure/digitalocean-production
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        
        # Log in to DigitalOcean Container Registry
        doctl registry login
        
        # Build backend image
        docker build -t ${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-backend:latest \
          ./Formerr-FastAPI
        
        # Push backend image
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:latest

    # Build and Push Frontend
    - name: Build and Push Frontend Image
      run: |
        # Get registry name from Terraform output
        cd infrastructure/digitalocean-production
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        
        # Build frontend image
        docker build -t ${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-frontend:latest \
          --build-arg NEXT_PUBLIC_API_URL=https://api.formerr.example.com \
          ./formerr-frontend
        
        # Push frontend image
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:latest

    # Deploy Application Secrets
    - name: Deploy Application Secrets
      run: |
        # Create namespace if not exists
        kubectl create namespace formerr --dry-run=client -o yaml | kubectl apply -f -
        
        # Create application secrets
        kubectl create secret generic formerr-app-secret \
          --namespace=formerr \
          --from-literal=GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
          --from-literal=GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --from-literal=SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    # Deploy Application
    - name: Deploy Backend
      run: |
        # Get registry endpoint from Terraform output
        cd infrastructure/digitalocean-production
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        cd ../..
        
        # Update image tags in deployment
        sed -i "s|registry.digitalocean.com/formerr-production/formerr-backend:latest|${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }}|g" k8s/production/backend-deployment.yaml
        kubectl apply -f k8s/production/backend-deployment.yaml

    - name: Deploy Frontend
      run: |
        # Get registry endpoint from Terraform output
        cd infrastructure/digitalocean-production
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        cd ../..
        
        # Update image tags in deployment
        sed -i "s|registry.digitalocean.com/formerr-production/formerr-frontend:latest|${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }}|g" k8s/production/frontend-deployment.yaml
        kubectl apply -f k8s/production/frontend-deployment.yaml

    # Deploy Security and Monitoring
    - name: Deploy Security Policies
      run: |
        kubectl apply -f k8s/security/network-policies.yaml

    - name: Deploy Application Monitoring
      run: |
        kubectl apply -f k8s/monitoring/app-monitoring.yaml

    - name: Deploy Autoscaling Configuration
      run: |
        # Install metrics server if not present
        kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        
        # Wait for metrics server to be ready
        kubectl wait --for=condition=ready pod -l k8s-app=metrics-server -n kube-system --timeout=300s
        
        # Deploy HPA and resource quotas
        kubectl apply -f k8s/autoscaling/hpa-config.yaml

    # Deploy Ingress
    - name: Deploy Ingress
      run: |
        kubectl apply -f k8s/production/ingress.yaml

    # Wait for deployment
    - name: Wait for Deployment
      run: |
        kubectl rollout status deployment/formerr-backend -n formerr --timeout=600s
        kubectl rollout status deployment/formerr-frontend -n formerr --timeout=600s

    # Validate Deployment
    - name: Validate Deployment
      run: |
        # Check if pods are running
        kubectl get pods -n formerr
        
        # Check services
        kubectl get services -n formerr
        
        # Check ingress
        kubectl get ingress -n formerr
        
        # Check backend health (internal)
        kubectl exec -n formerr deployment/formerr-backend -- curl -f http://localhost:8000/health || exit 1
        
        echo "✅ Production deployment completed successfully!"

    # Get Load Balancer IP
    - name: Get Load Balancer Info
      run: |
        echo "🌐 Ingress Controller Load Balancer IP:"
        kubectl get service ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ""
        echo "📊 Grafana Load Balancer IP:"
        kubectl get service prometheus-grafana -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || echo "Not ready yet"
        echo ""
        echo "🔍 Prometheus Load Balancer IP:"
        kubectl get service prometheus-kube-prometheus-prometheus -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || echo "Not ready yet"
