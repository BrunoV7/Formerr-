name: 🚀 Deploy - Produção

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag da imagem para deploy'
        required: false
        type: string
        default: 'latest'
  push:
    branches: [main]
    paths:
      - 'Formerr-FastAPI/**'
      - 'formerr-frontend/**'
      - 'infrastructure/k8s/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem para deploy'
        required: false
        type: string
        default: 'latest'

env:
  REGISTRY: registry.digitalocean.com
  REPO_NAME: formerr
  ENVIRONMENT: 'production'

jobs:
  build-and-push:
    name: 🏗️ Build e Push das Imagens
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DO_TOKEN_PROD }}
    
    - name: Log in to DigitalOcean Container Registry
      run: doctl registry login --expiry-seconds 1200
    
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./Formerr-FastAPI
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-backend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-backend:${{ env.ENVIRONMENT }}-latest
          ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-backend:${{ inputs.image_tag }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./formerr-frontend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-frontend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-frontend:${{ env.ENVIRONMENT }}-latest
          ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-frontend:${{ inputs.image_tag }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
    
    - name: Scan images for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-backend:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-backend.sarif'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Backend scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-backend.sarif
    
    - name: Scan Frontend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-frontend:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-frontend.sarif'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Frontend scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-frontend.sarif

  deploy-to-kubernetes:
    name: ☸️ Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: production-cluster-credentials
        path: ./credentials
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ needs.build-and-push.outputs.cluster_ca }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster production-cluster \
          --server=${{ needs.build-and-push.outputs.cluster_endpoint }} \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials production-user \
          --token=${{ needs.build-and-push.outputs.cluster_token }}
        kubectl config set-context production-context \
          --cluster=production-cluster \
          --user=production-user \
          --namespace=formerr
        kubectl config use-context production-context
    
    - name: Prepare secrets
      run: |
        # Get values from secrets or use defaults
        POSTGRES_PASS="${{ secrets.DB_PASSWORD || secrets.POSTGRES_PASSWORD || 'formerr_prod_pass_2024' }}"
        JWT_SECRET="${{ secrets.JWT_SECRET || 'brunov7_super_secret_formerr_2025' }}"
        SESSION_SECRET="${{ secrets.SESSION_SECRET || 'brunov7_session_secret_2025' }}"
        DB_HOST="${{ secrets.DB_HOST || 'postgres-service' }}"
        DB_PORT="${{ secrets.DB_PORT || '5432' }}"
        DB_USER="${{ secrets.DB_USER || 'formerr_user' }}"
        DB_NAME="${{ secrets.DB_NAME || 'formerr_db' }}"
        DATABASE_URL="${{ secrets.DATABASE_URL || 'postgresql+asyncpg://formerr_user:POSTGRES_PASSWORD_PLACEHOLDER@postgres-service:5432/formerr_db' }}"
        CLIENT_ID="${{ secrets.CLIENT_ID || 'Ov23libwTy1CTdfzvbRg' }}"
        CLIENT_SECRET="${{ secrets.CLIENT_SECRET || '4f07c7baa3fba7eb00d2e57ba48ae2e15d2da110' }}"
        
        # Prepare secrets file
        cp infrastructure/k8s/secrets-template.yaml infrastructure/k8s/secrets-processed.yaml
        
        # Replace placeholders with actual values
        sed -i "s/POSTGRES_PASSWORD_PLACEHOLDER/${POSTGRES_PASS}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/JWT_SECRET_PLACEHOLDER/${JWT_SECRET}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/SESSION_SECRET_PLACEHOLDER/${SESSION_SECRET}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/GITHUB_CLIENT_ID_PLACEHOLDER/${CLIENT_ID}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/GITHUB_CLIENT_SECRET_PLACEHOLDER/${CLIENT_SECRET}/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/FRONTEND_SUCCESS_URL_PLACEHOLDER/http:\/\/production-frontend\/auth\/success/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/FRONTEND_ERROR_URL_PLACEHOLDER/http:\/\/production-frontend\/auth\/error/g" infrastructure/k8s/secrets-processed.yaml
        sed -i "s/OAUTH_CALLBACK_URL_PLACEHOLDER/http:\/\/production-backend\/auth\/github\/callback/g" infrastructure/k8s/secrets-processed.yaml
        
        # Replace DATABASE_URL placeholder
        sed -i "s|DATABASE_URL_PLACEHOLDER|${DATABASE_URL}|g" infrastructure/k8s/secrets-processed.yaml
        
        # Use complete DATABASE_URL if provided, otherwise construct it
        if [ -n "${DATABASE_URL}" ] && [ "${DATABASE_URL}" != "postgresql+asyncpg://formerr_user:POSTGRES_PASSWORD_PLACEHOLDER@postgres-service:5432/formerr_db" ]; then
          sed -i "s|postgresql+asyncpg:\/\/formerr_user:POSTGRES_PASSWORD_PLACEHOLDER@postgres-service:5432\/formerr_db|${DATABASE_URL}|g" infrastructure/k8s/secrets-processed.yaml
        else
          sed -i "s/postgresql+asyncpg:\/\/formerr_user:POSTGRES_PASSWORD_PLACEHOLDER@postgres-service:5432\/formerr_db/postgresql+asyncpg:\/\/${DB_USER}:${POSTGRES_PASS}@${DB_HOST}:${DB_PORT}\/${DB_NAME}?ssl=require/g" infrastructure/k8s/secrets-processed.yaml
        fi
        
        # Update image tags in deployments
        sed -i "s|formerr-backend:latest|${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-backend:${{ github.sha }}|g" infrastructure/k8s/backend-deployment.yaml
        sed -i "s|formerr-frontend:latest|${{ env.REGISTRY }}/${{ env.REPO_NAME }}/formerr-frontend:${{ github.sha }}|g" infrastructure/k8s/frontend-deployment.yaml
    
    - name: Deploy to Kubernetes
      run: |
        # Apply manifests
        kubectl apply -f infrastructure/k8s/secrets-processed.yaml
        kubectl apply -f infrastructure/k8s/postgres-deployment.yaml
        kubectl apply -f infrastructure/k8s/backend-deployment.yaml
        kubectl apply -f infrastructure/k8s/frontend-deployment.yaml
    
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/formerr-backend -n formerr --timeout=300s
        kubectl rollout status deployment/formerr-frontend -n formerr --timeout=300s
    
    - name: Verify deployment
      run: |
        echo "🔍 Verificando deployment..."
        
        # Check pods status
        kubectl get pods -n formerr -o wide
        
        # Check services
        kubectl get svc -n formerr -o wide
        
        # Check if pods are ready
        BACKEND_READY=$(kubectl get pods -n formerr -l app=formerr-backend -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}')
        FRONTEND_READY=$(kubectl get pods -n formerr -l app=formerr-frontend -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}')
        
        echo "Backend Ready: $BACKEND_READY"
        echo "Frontend Ready: $FRONTEND_READY"
        
        if [ "$BACKEND_READY" != "True" ] || [ "$FRONTEND_READY" != "True" ]; then
          echo "❌ Deployment verification failed"
          exit 1
        fi
        
        echo "✅ Deployment verification successful"
    
    - name: Get service URLs
      run: |
        echo "🌐 PRODUCTION URLS:"
        echo "Frontend: http://$(kubectl get svc formerr-frontend-service -n formerr -o jsonpath='{.status.loadBalancer.ingress[0].ip}'):3000"
        echo "Backend: http://$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}'):8000"
        echo ""
        echo "📊 Load Balancer IP:"
        kubectl get svc -n formerr -o wide

  validation:
    name: ✅ Validação Pós-Deploy
    runs-on: ubuntu-latest
    needs: deploy-to-kubernetes
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: production-cluster-credentials
        path: ./credentials
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ needs.deploy-to-kubernetes.outputs.cluster_ca }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster production-cluster \
          --server=${{ needs.deploy-to-kubernetes.outputs.cluster_endpoint }} \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials production-user \
          --token=${{ needs.deploy-to-kubernetes.outputs.cluster_token }}
        kubectl config set-context production-context \
          --cluster=production-cluster \
          --user=production-user \
          --namespace=formerr
        kubectl config use-context production-context
    
    - name: Health check endpoints
      run: |
        echo "🏥 Executando health checks..."
        
        # Get service IPs
        FRONTEND_IP=$(kubectl get svc formerr-frontend-service -n formerr -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        BACKEND_IP=$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}')
        
        echo "Frontend IP: $FRONTEND_IP"
        echo "Backend IP: $BACKEND_IP"
        
        # Wait for services to be ready
        sleep 30
        
        # Test endpoints with retries
        for i in {1..5}; do
          echo "Attempt $i: Testing endpoints..."
          
          # Test Backend health
          if curl -f -s -o /dev/null -w "Backend Health: %{http_code}\n" http://$BACKEND_IP:8000/health; then
            echo "✅ Backend health check passed"
            break
          else
            echo "❌ Backend health check failed (attempt $i)"
            if [ $i -eq 5 ]; then
              echo "❌ Backend health check failed after 5 attempts"
              exit 1
            fi
            sleep 10
          fi
        done
        
        # Test Frontend
        for i in {1..5}; do
          if curl -f -s -o /dev/null -w "Frontend: %{http_code}\n" http://$FRONTEND_IP:3000; then
            echo "✅ Frontend check passed"
            break
          else
            echo "❌ Frontend check failed (attempt $i)"
            if [ $i -eq 5 ]; then
              echo "❌ Frontend check failed after 5 attempts"
              exit 1
            fi
            sleep 10
          fi
        done
    
    - name: Performance test
      run: |
        echo "⚡ Executando teste de performance básico..."
        
        BACKEND_IP=$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}')
        
        # Simple load test
        for i in {1..10}; do
          start_time=$(date +%s%N)
          curl -s -o /dev/null http://$BACKEND_IP:8000/health
          end_time=$(date +%s%N)
          duration=$(( (end_time - start_time) / 1000000 ))
          echo "Request $i: ${duration}ms"
        done
    
    - name: Generate deployment report
      run: |
        echo "📋 Relatório de Deploy - Produção"
        echo "================================="
        echo "Timestamp: $(date)"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        echo "Image Tag: ${{ github.sha }}"
        echo ""
        echo "✅ Deploy concluído com sucesso"
        echo "✅ Validação de endpoints passou"
        echo "✅ Performance test executado"
        echo ""
        echo "🌐 URLs de Acesso:"
        echo "Frontend: http://$(kubectl get svc formerr-frontend-service -n formerr -o jsonpath='{.status.loadBalancer.ingress[0].ip}'):3000"
        echo "Backend: http://$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}'):8000" 