name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ github.event.inputs.environment == 'production' && secrets.DO_TOKEN_PROD || secrets.DO_STAGING_TOKEN }}

    - name: Terraform Destroy
      run: |
        cd infrastructure/digitalocean-${{ github.event.inputs.environment }}
        terraform init
        
        # Set additional variables for production environment
        if [ "${{ github.event.inputs.environment }}" = "production" ]; then
          terraform destroy -auto-approve \
            -var="do_token=${{ secrets.DO_TOKEN_PROD }}" \
            -var="github_client_id=${{ secrets.CLIENT_ID }}" \
            -var="github_client_secret=${{ secrets.CLIENT_SECRET }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="session_secret=${{ secrets.SESSION_SECRET }}" \
            -var="database_url=${{ secrets.DATABASE_URL }}" \
            -var="db_host=${{ secrets.DB_HOST }}" \
            -var="db_port=${{ secrets.DB_PORT }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="registry_name=formerr-registry" \
            -var="use_existing_vpc=false" \
            -var="use_existing_cluster=false" \
            -var="use_existing_loadbalancer=false" \
            -var="create_registry=false"
        else
          terraform destroy -auto-approve \
            -var="do_token=${{ secrets.DO_STAGING_TOKEN }}" \
            -var="github_client_id=${{ secrets.CLIENT_ID }}" \
            -var="github_client_secret=${{ secrets.CLIENT_SECRET }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="session_secret=${{ secrets.SESSION_SECRET }}" \
            -var="registry_name=formerr-staging" \
            -var="use_existing_vpc=false" \
            -var="use_existing_cluster=false" \
            -var="use_existing_loadbalancer=false" \
            -var="create_registry=false"
        fi

    - name: Notify Destruction
      run: |
        echo "🗑️ ${{ github.event.inputs.environment }} infrastructure has been destroyed!"
