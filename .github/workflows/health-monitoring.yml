name: Health Check & Monitoring

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ matrix.environment == 'production' && secrets.DO_PROD_TOKEN || secrets.DO_STAGING_TOKEN }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        if [ "${{ matrix.environment }}" == "production" ]; then
          doctl kubernetes cluster kubeconfig save formerr-production-cluster
        else
          doctl kubernetes cluster kubeconfig save formerr-staging-cluster
        fi

    - name: Check Cluster Health
      run: |
        echo "🔍 Checking ${{ matrix.environment }} cluster health..."
        
        # Check cluster nodes
        echo "📊 Cluster Nodes:"
        kubectl get nodes
        
        # Check system pods
        echo "🔧 System Pods Status:"
        kubectl get pods -n kube-system --field-selector=status.phase!=Running || true
        
        # Check application pods
        echo "🚀 Application Pods Status:"
        kubectl get pods -n formerr
        
        # Check monitoring pods
        echo "📈 Monitoring Pods Status:"
        kubectl get pods -n monitoring | head -10

    - name: Check Application Health
      run: |
        echo "🏥 Checking application health endpoints..."
        
        # Check if backend is responding
        BACKEND_POD=$(kubectl get pods -n formerr -l app=formerr-backend -o jsonpath='{.items[0].metadata.name}')
        if [ ! -z "$BACKEND_POD" ]; then
          echo "Backend health check:"
          kubectl exec -n formerr $BACKEND_POD -- curl -f http://localhost:8000/health || echo "❌ Backend health check failed"
        else
          echo "❌ No backend pods found"
        fi
        
        # Check if frontend is responding
        FRONTEND_POD=$(kubectl get pods -n formerr -l app=formerr-frontend -o jsonpath='{.items[0].metadata.name}')
        if [ ! -z "$FRONTEND_POD" ]; then
          echo "Frontend health check:"
          kubectl exec -n formerr $FRONTEND_POD -- curl -f http://localhost:3000 || echo "❌ Frontend health check failed"
        else
          echo "❌ No frontend pods found"
        fi

    - name: Check Resource Usage
      run: |
        echo "📊 Resource Usage Summary:"
        
        # Node resource usage
        kubectl top nodes || echo "Metrics server not available"
        
        # Pod resource usage
        echo "Top resource consuming pods:"
        kubectl top pods -n formerr || echo "Metrics not available"

    - name: Check Services and Ingress
      run: |
        echo "🌐 Services Status:"
        kubectl get services -n formerr
        
        echo "🔗 Ingress Status:"
        kubectl get ingress -n formerr
        
        echo "🔒 TLS Certificates:"
        kubectl get certificates -n formerr || echo "No certificates found"

    - name: Check Monitoring Stack
      run: |
        echo "📊 Monitoring Stack Status:"
        
        # Check Prometheus
        PROM_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        if [ ! -z "$PROM_POD" ]; then
          echo "✅ Prometheus is running"
        else
          echo "❌ Prometheus not found"
        fi
        
        # Check Grafana
        GRAFANA_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        if [ ! -z "$GRAFANA_POD" ]; then
          echo "✅ Grafana is running"
        else
          echo "❌ Grafana not found"
        fi

    - name: Generate Health Report
      run: |
        echo "📋 Health Report for ${{ matrix.environment }} environment"
        echo "=================================================="
        echo "Timestamp: $(date)"
        echo ""
        
        # Count healthy pods
        TOTAL_PODS=$(kubectl get pods -n formerr --no-headers | wc -l)
        RUNNING_PODS=$(kubectl get pods -n formerr --field-selector=status.phase=Running --no-headers | wc -l)
        
        echo "Application Pods: $RUNNING_PODS/$TOTAL_PODS running"
        
        # Check persistent volumes
        echo ""
        echo "Persistent Volumes:"
        kubectl get pv 2>/dev/null || echo "No persistent volumes"
        
        # Check storage usage
        echo ""
        echo "Storage Classes:"
        kubectl get storageclass

    - name: Alert on Critical Issues
      if: failure()
      run: |
        echo "🚨 CRITICAL: Health check failed for ${{ matrix.environment }} environment!"
        echo "Please investigate the issues immediately."
        
        # In a real setup, you would send alerts to Slack, PagerDuty, etc.
        # Example: Send to Slack webhook
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"🚨 Health check failed for ${{ matrix.environment }}!"}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}

  performance-check:
    runs-on: ubuntu-latest
    needs: health-check
    if: success()
    
    steps:
    - name: Simple Performance Test
      run: |
        echo "🚀 Running basic performance check..."
        
        # This is a placeholder for performance testing
        # You could integrate with tools like:
        # - k6 for load testing
        # - Artillery for API testing
        # - Lighthouse for frontend performance
        
        echo "✅ Performance tests would run here"
        echo "Consider integrating:"
        echo "  - Load testing with k6"
        echo "  - API response time monitoring"
        echo "  - Frontend performance metrics"
