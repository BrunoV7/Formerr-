name: Deploy to Staging (DigitalOcean)

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: formerr-staging
  CLUSTER_NAME: formerr-staging-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DO_STAGING_TOKEN }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.33.0'

    # Infrastructure Detection and Deployment
    - name: Detect Existing Resources and Deploy Infrastructure
      run: |
        # Make scripts executable
        chmod +x scripts/smart-deploy.sh scripts/validate-terraform.sh scripts/update-staging.sh
        
        # Validate Terraform configuration first
        ./scripts/validate-terraform.sh
        
        # Set environment variables for staging deployment
        export DO_STAGING_TOKEN="${{ secrets.DO_STAGING_TOKEN }}"
        export GITHUB_CLIENT_ID="${{ secrets.CLIENT_ID }}"
        export GITHUB_CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
        export SKIP_CONFIRM=1
        
        # Update staging configuration and run smart deployment
        ./scripts/update-staging.sh
        ./scripts/smart-deploy.sh staging formerr-staging

    # Configure kubectl
    - name: Configure kubectl for Staging Cluster
      run: |
        # Get cluster name from Terraform output
        cd infrastructure/digitalocean-staging
        CLUSTER_NAME=$(terraform output -raw cluster_name)
        doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

    # Smart Infrastructure Installation (only installs what's missing)
    - name: Install Missing Infrastructure Components
      run: |
        # Make script executable and run smart installation
        chmod +x scripts/smart-install-infrastructure.sh
        ./scripts/smart-install-infrastructure.sh

    # Build and Push Backend
    - name: Build and Push Backend Image
      run: |
        # Get registry endpoint from Terraform output
        REGISTRY_ENDPOINT=$(cd infrastructure/digitalocean-staging && terraform output -raw registry_endpoint)
        
        # Log in to DigitalOcean Container Registry
        doctl registry login
        
        # Build backend image (from repo root)
        docker build -t ${REGISTRY_ENDPOINT}/formerr-backend:staging-${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-backend:staging-latest \
          ./Formerr-FastAPI
        
        # Push backend image
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:staging-${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:staging-latest

    # Build and Push Frontend
    - name: Build and Push Frontend Image
      run: |
        # Get registry endpoint from Terraform output
        REGISTRY_ENDPOINT=$(cd infrastructure/digitalocean-staging && terraform output -raw registry_endpoint)
        
        # Build frontend image (from repo root)
        docker build -t ${REGISTRY_ENDPOINT}/formerr-frontend:staging-${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-frontend:staging-latest \
          --build-arg NEXT_PUBLIC_API_URL=https://api-staging.formerr.example.com \
          ./formerr-frontend
        
        # Push frontend image
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:staging-${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:staging-latest
        
        # Build backend image
        docker build -t ${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-backend:latest \
          ./Formerr-FastAPI
        
        # Push backend image
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-backend:latest

    # Build and Push Frontend
    - name: Build and Push Frontend Image
      run: |
        # Get registry endpoint from Terraform output
        cd infrastructure/digitalocean-staging
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        
        # Build frontend image
        docker build -t ${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }} \
          -t ${REGISTRY_ENDPOINT}/formerr-frontend:latest \
          --build-arg NEXT_PUBLIC_API_URL=https://api-staging.formerr.example.com \
          ./formerr-frontend
        
        # Push frontend image
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }}
        docker push ${REGISTRY_ENDPOINT}/formerr-frontend:latest

    # Deploy PostgreSQL Database
    - name: Deploy PostgreSQL Database
      run: |
        # Create namespace if not exists
        kubectl create namespace formerr --dry-run=client -o yaml | kubectl apply -f -
        
        # Generate random passwords for PostgreSQL
        POSTGRES_PASSWORD=$(openssl rand -base64 32)
        FORMERR_USER_PASSWORD=$(openssl rand -base64 32)
        
        # Create PostgreSQL secrets
        kubectl create secret generic postgres-secret \
          --namespace=formerr \
          --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          --from-literal=FORMERR_USER_PASSWORD="$FORMERR_USER_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -
        
        # Deploy PostgreSQL
        kubectl apply -f k8s/staging/postgresql.yaml
        
        # Wait for PostgreSQL to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/postgresql -n formerr
        
        # Create database connection secret for the application
        kubectl create secret generic formerr-db-secret \
          --namespace=formerr \
          --from-literal=DATABASE_URL="postgresql://formerr_user:$FORMERR_USER_PASSWORD@postgresql.formerr.svc.cluster.local:5432/formerr_db" \
          --from-literal=DB_HOST="postgresql.formerr.svc.cluster.local" \
          --from-literal=DB_PORT="5432" \
          --from-literal=DB_NAME="formerr_db" \
          --from-literal=DB_USER="formerr_user" \
          --from-literal=DB_PASSWORD="$FORMERR_USER_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy Application Secrets
      run: |
        # Create application secrets (namespace already exists from previous step)
        kubectl create secret generic formerr-app-secret \
          --namespace=formerr \
          --from-literal=GITHUB_CLIENT_ID="${{ secrets.CLIENT_ID }}" \
          --from-literal=GITHUB_CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --from-literal=SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    # Deploy Application
    - name: Deploy Backend
      run: |
        # Get registry endpoint from Terraform output
        cd infrastructure/digitalocean-staging
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        cd ../..
        
        # Update image tags in deployment
        sed -i "s|registry.digitalocean.com/formerr-staging/formerr-backend:latest|${REGISTRY_ENDPOINT}/formerr-backend:${{ github.sha }}|g" k8s/staging/backend-deployment.yaml
        kubectl apply -f k8s/staging/backend-deployment.yaml

    - name: Deploy Frontend
      run: |
        # Get registry endpoint from Terraform output
        cd infrastructure/digitalocean-staging
        REGISTRY_ENDPOINT=$(terraform output -raw registry_endpoint)
        cd ../..
        
        # Update image tags in deployment
        sed -i "s|registry.digitalocean.com/formerr-staging/formerr-frontend:latest|${REGISTRY_ENDPOINT}/formerr-frontend:${{ github.sha }}|g" k8s/staging/frontend-deployment.yaml
        kubectl apply -f k8s/staging/frontend-deployment.yaml

    # Deploy Ingress
    - name: Deploy Ingress
      run: |
        kubectl apply -f k8s/staging/ingress.yaml

    # Deploy Monitoring
    - name: Deploy Simple Monitoring Stack
      run: |
        echo "📊 Deploying simple monitoring stack for staging..."
        
        # Use simple monitoring script
        chmod +x scripts/install-simple-monitoring.sh
        ./scripts/install-simple-monitoring.sh

    # Wait for deployment
    - name: Wait for Deployment
      run: |
        kubectl rollout status deployment/formerr-backend -n formerr --timeout=600s
        kubectl rollout status deployment/formerr-frontend -n formerr --timeout=600s

    # Run Integration Tests
    - name: Run Integration Tests
      run: |
        # Wait a bit for services to be fully ready
        sleep 30
        
        # Check if pods are running
        kubectl get pods -n formerr
        
        # Check services
        kubectl get services -n formerr
        
        # Check ingress
        kubectl get ingress -n formerr
        
        # Check monitoring
        echo "📊 Monitoring Status:"
        kubectl get pods -n monitoring
        kubectl get services -n monitoring
        
        # Check backend health (internal)
        kubectl exec -n formerr deployment/formerr-backend -- curl -f http://localhost:8000/health || exit 1
        
        echo "✅ Staging deployment completed successfully!"

    # Get Load Balancer Info
    - name: Get Load Balancer Info
      run: |
        echo "🌐 Ingress Controller Load Balancer IP:"
        kubectl get service ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ""
        echo "📊 Prometheus Load Balancer IP:"
        kubectl get service prometheus -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "Not ready yet"
        echo ""
        echo "� Access Prometheus:"
        echo "   kubectl port-forward -n monitoring svc/prometheus 9090:9090"

    # Notify on Success
    - name: Notify Success
      if: success()
      run: |
        echo "🎉 Staging environment deployed successfully!"
        echo "📝 You can now test your changes in the staging environment."
        echo "🚀 If everything looks good, merge to main to deploy to production."
