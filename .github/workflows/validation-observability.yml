name: 🔍 Validação e Observabilidade

on:
  workflow_call:
    inputs:
      environment:
        description: 'Ambiente para validação'
        required: true
        type: string
        default: 'staging'
      cluster_endpoint:
        description: 'Endpoint do cluster'
        required: true
        type: string
      cluster_token:
        description: 'Token do cluster'
        required: true
        type: string
      cluster_ca:
        description: 'CA do cluster'
        required: true
        type: string
  workflow_run:
    workflows: ["🚀 Deploy - Produção", "🚀 Deploy - Staging"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para validação'
        required: true
        type: choice
        options:
        - staging
        - production

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  validation:
    name: ✅ Validação de Endpoints
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ENVIRONMENT }}-cluster-credentials
        path: ./credentials
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ github.event.inputs.cluster_ca || 'PLACEHOLDER_CA' }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster ${{ env.ENVIRONMENT }}-cluster \
          --server="${{ github.event.inputs.cluster_endpoint || 'PLACEHOLDER_ENDPOINT' }}" \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials ${{ env.ENVIRONMENT }}-user \
          --token="${{ github.event.inputs.cluster_token || 'PLACEHOLDER_TOKEN' }}"
        kubectl config set-context ${{ env.ENVIRONMENT }}-context \
          --cluster=${{ env.ENVIRONMENT }}-cluster \
          --user=${{ env.ENVIRONMENT }}-user \
          --namespace=formerr
        kubectl config use-context ${{ env.ENVIRONMENT }}-context
    
    - name: Health check endpoints
      run: |
        echo "🏥 Executando health checks para ${{ env.ENVIRONMENT }}..."
        
        # Get service IPs
        FRONTEND_IP=$(kubectl get svc formerr-frontend-service -n formerr -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        BACKEND_IP=$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}')
        
        echo "Frontend IP: $FRONTEND_IP"
        echo "Backend IP: $BACKEND_IP"
        
        # Wait for services to be ready
        sleep 30
        
        # Test endpoints with retries
        for i in {1..5}; do
          echo "Attempt $i: Testing endpoints..."
          
          # Test Backend health
          if curl -f -s -o /dev/null -w "Backend Health: %{http_code}\n" http://$BACKEND_IP:8000/health; then
            echo "✅ Backend health check passed"
            break
          else
            echo "❌ Backend health check failed (attempt $i)"
            if [ $i -eq 5 ]; then
              echo "❌ Backend health check failed after 5 attempts"
              exit 1
            fi
            sleep 10
          fi
        done
        
        # Test Frontend
        for i in {1..5}; do
          if curl -f -s -o /dev/null -w "Frontend: %{http_code}\n" http://$FRONTEND_IP:3000; then
            echo "✅ Frontend check passed"
            break
          else
            echo "❌ Frontend check failed (attempt $i)"
            if [ $i -eq 5 ]; then
              echo "❌ Frontend check failed after 5 attempts"
              exit 1
            fi
            sleep 10
          fi
        done
    
    - name: API endpoint validation
      run: |
        echo "🔍 Validando endpoints da API..."
        
        BACKEND_IP=$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}')
        
        # Test various API endpoints
        echo "Testing /health endpoint..."
        curl -f -s http://$BACKEND_IP:8000/health || echo "Health endpoint failed"
        
        echo "Testing /docs endpoint..."
        curl -f -s http://$BACKEND_IP:8000/docs || echo "Docs endpoint failed"
        
        echo "Testing /forms endpoint..."
        curl -f -s http://$BACKEND_IP:8000/forms/ || echo "Forms endpoint failed"
        
        echo "Testing /auth endpoint..."
        curl -f -s http://$BACKEND_IP:8000/auth/ || echo "Auth endpoint failed"

  prometheus-metrics:
    name: 📊 Verificar Métricas Prometheus
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ENVIRONMENT }}-cluster-credentials
        path: ./credentials
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ github.event.inputs.cluster_ca || 'PLACEHOLDER_CA' }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster ${{ env.ENVIRONMENT }}-cluster \
          --server="${{ github.event.inputs.cluster_endpoint || 'PLACEHOLDER_ENDPOINT' }}" \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials ${{ env.ENVIRONMENT }}-user \
          --token="${{ github.event.inputs.cluster_token || 'PLACEHOLDER_TOKEN' }}"
        kubectl config set-context ${{ env.ENVIRONMENT }}-context \
          --cluster=${{ env.ENVIRONMENT }}-cluster \
          --user=${{ env.ENVIRONMENT }}-user \
          --namespace=monitoring
        kubectl config use-context ${{ env.ENVIRONMENT }}-context
    
    - name: Check Prometheus status
      run: |
        echo "📊 Verificando status do Prometheus..."
        
        # Check if Prometheus pods are running
        kubectl get pods -n monitoring -l app=prometheus
        
        # Check Prometheus service
        kubectl get svc -n monitoring -l app=prometheus
        
        # Get Prometheus pod name
        PROMETHEUS_POD=$(kubectl get pods -n monitoring -l app=prometheus -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        
        if [ -n "$PROMETHEUS_POD" ]; then
          echo "Prometheus pod: $PROMETHEUS_POD"
          
          # Port forward to Prometheus
          kubectl port-forward -n monitoring $PROMETHEUS_POD 9090:9090 &
          PF_PID=$!
          sleep 10
          
          # Test Prometheus API
          echo "Testing Prometheus API..."
          curl -f -s -o /dev/null -w "Prometheus API: %{http_code}\n" http://localhost:9090/api/v1/status/config || echo "Prometheus API not accessible"
          
          # Check if metrics are being collected
          echo "Checking metrics collection..."
          curl -f -s "http://localhost:9090/api/v1/query?query=up" | jq '.data.result[] | select(.metric.job == "kubernetes-pods")' || echo "No pod metrics found"
          
          # Check application metrics
          echo "Checking application metrics..."
          curl -f -s "http://localhost:9090/api/v1/query?query=formerr" || echo "No application metrics found"
          
          kill $PF_PID 2>/dev/null || true
        else
          echo "❌ Prometheus pod not found"
        fi
    
    - name: Check metrics endpoints
      run: |
        echo "🔍 Verificando endpoints de métricas..."
        
        # Switch to application namespace
        kubectl config set-context ${{ env.ENVIRONMENT }}-context --namespace=formerr
        
        # Get backend pod
        BACKEND_POD=$(kubectl get pods -n formerr -l app=formerr-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        
        if [ -n "$BACKEND_POD" ]; then
          echo "Backend pod: $BACKEND_POD"
          
          # Port forward to backend metrics
          kubectl port-forward -n formerr $BACKEND_POD 8000:8000 &
          PF_PID=$!
          sleep 10
          
          # Test metrics endpoint
          echo "Testing /metrics endpoint..."
          curl -f -s -o /dev/null -w "Metrics endpoint: %{http_code}\n" http://localhost:8000/metrics || echo "Metrics endpoint not accessible"
          
          # Check if metrics are being exposed
          echo "Checking exposed metrics..."
          curl -f -s http://localhost:8000/metrics | grep -E "(http_requests_total|http_request_duration_seconds)" || echo "No application metrics found"
          
          kill $PF_PID 2>/dev/null || true
        else
          echo "❌ Backend pod not found"
        fi

  grafana-dashboards:
    name: 📈 Verificar Dashboards Grafana
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ENVIRONMENT }}-cluster-credentials
        path: ./credentials
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ github.event.inputs.cluster_ca || 'PLACEHOLDER_CA' }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster ${{ env.ENVIRONMENT }}-cluster \
          --server="${{ github.event.inputs.cluster_endpoint || 'PLACEHOLDER_ENDPOINT' }}" \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials ${{ env.ENVIRONMENT }}-user \
          --token="${{ github.event.inputs.cluster_token || 'PLACEHOLDER_TOKEN' }}"
        kubectl config set-context ${{ env.ENVIRONMENT }}-context \
          --cluster=${{ env.ENVIRONMENT }}-cluster \
          --user=${{ env.ENVIRONMENT }}-user \
          --namespace=monitoring
        kubectl config use-context ${{ env.ENVIRONMENT }}-context
    
    - name: Check Grafana status
      run: |
        echo "📈 Verificando status do Grafana..."
        
        # Check if Grafana pods are running
        kubectl get pods -n monitoring -l app=grafana
        
        # Check Grafana service
        kubectl get svc -n monitoring -l app=grafana
        
        # Get Grafana pod name
        GRAFANA_POD=$(kubectl get pods -n monitoring -l app=grafana -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        
        if [ -n "$GRAFANA_POD" ]; then
          echo "Grafana pod: $GRAFANA_POD"
          
          # Port forward to Grafana
          kubectl port-forward -n monitoring $GRAFANA_POD 3001:3000 &
          PF_PID=$!
          sleep 10
          
          # Test Grafana API
          echo "Testing Grafana API..."
          curl -f -s -o /dev/null -w "Grafana API: %{http_code}\n" http://localhost:3001/api/health || echo "Grafana API not accessible"
          
          # Check dashboards
          echo "Checking available dashboards..."
          curl -f -s "http://localhost:3001/api/search" | jq '.[] | select(.type == "dash-db") | .title' || echo "No dashboards found"
          
          # Check datasources
          echo "Checking datasources..."
          curl -f -s "http://localhost:3001/api/datasources" | jq '.[] | .name' || echo "No datasources found"
          
          kill $PF_PID 2>/dev/null || true
        else
          echo "❌ Grafana pod not found"
        fi

  performance-test:
    name: ⚡ Teste de Performance
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Download cluster credentials
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ENVIRONMENT }}-cluster-credentials
        path: ./credentials
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ github.event.inputs.cluster_ca || 'PLACEHOLDER_CA' }}" | base64 -d > $HOME/.kube/ca.crt
        kubectl config set-cluster ${{ env.ENVIRONMENT }}-cluster \
          --server="${{ github.event.inputs.cluster_endpoint || 'PLACEHOLDER_ENDPOINT' }}" \
          --certificate-authority=$HOME/.kube/ca.crt
        kubectl config set-credentials ${{ env.ENVIRONMENT }}-user \
          --token="${{ github.event.inputs.cluster_token || 'PLACEHOLDER_TOKEN' }}"
        kubectl config set-context ${{ env.ENVIRONMENT }}-context \
          --cluster=${{ env.ENVIRONMENT }}-cluster \
          --user=${{ env.ENVIRONMENT }}-user \
          --namespace=formerr
        kubectl config use-context ${{ env.ENVIRONMENT }}-context
    
    - name: Run performance tests
      run: |
        echo "⚡ Executando testes de performance..."
        
        BACKEND_IP=$(kubectl get svc formerr-backend-service -n formerr -o jsonpath='{.spec.clusterIP}')
        
        # Simple load test
        echo "Running load test..."
        for i in {1..20}; do
          start_time=$(date +%s%N)
          curl -s -o /dev/null http://$BACKEND_IP:8000/health
          end_time=$(date +%s%N)
          duration=$(( (end_time - start_time) / 1000000 ))
          echo "Request $i: ${duration}ms"
        done
        
        # Concurrent requests test
        echo "Running concurrent requests test..."
        for i in {1..5}; do
          curl -s -o /dev/null http://$BACKEND_IP:8000/health &
        done
        wait
        
        echo "Performance test completed"

  generate-report:
    name: 📋 Gerar Relatório Final
    runs-on: ubuntu-latest
    needs: [validation, prometheus-metrics, grafana-dashboards, performance-test]
    if: always()
    
    steps:
    - name: Generate validation report
      run: |
        echo "🔍 Relatório de Validação e Observabilidade - ${{ env.ENVIRONMENT | upper }}"
        echo "=================================================================="
        echo "Timestamp: $(date)"
        echo "Environment: ${{ env.ENVIRONMENT }}"
        echo ""
        echo "Status dos Jobs:"
        echo "- Endpoint Validation: ${{ needs.validation.result }}"
        echo "- Prometheus Metrics: ${{ needs.prometheus-metrics.result }}"
        echo "- Grafana Dashboards: ${{ needs.grafana-dashboards.result }}"
        echo "- Performance Test: ${{ needs.performance-test.result }}"
        echo ""
        
        if [ "${{ needs.validation.result }}" == "success" ]; then
          echo "✅ Validação de endpoints passou"
        else
          echo "❌ Validação de endpoints falhou"
        fi
        
        if [ "${{ needs.prometheus-metrics.result }}" == "success" ]; then
          echo "✅ Métricas do Prometheus estão funcionando"
        else
          echo "❌ Métricas do Prometheus com problemas"
        fi
        
        if [ "${{ needs.grafana-dashboards.result }}" == "success" ]; then
          echo "✅ Dashboards do Grafana estão acessíveis"
        else
          echo "❌ Dashboards do Grafana com problemas"
        fi
        
        if [ "${{ needs.performance-test.result }}" == "success" ]; then
          echo "✅ Teste de performance executado com sucesso"
        else
          echo "❌ Teste de performance falhou"
        fi
        
        echo ""
        echo "🎯 Resumo:"
        SUCCESS_COUNT=0
        TOTAL_JOBS=4
        
        if [ "${{ needs.validation.result }}" == "success" ]; then SUCCESS_COUNT=$((SUCCESS_COUNT + 1)); fi
        if [ "${{ needs.prometheus-metrics.result }}" == "success" ]; then SUCCESS_COUNT=$((SUCCESS_COUNT + 1)); fi
        if [ "${{ needs.grafana-dashboards.result }}" == "success" ]; then SUCCESS_COUNT=$((SUCCESS_COUNT + 1)); fi
        if [ "${{ needs.performance-test.result }}" == "success" ]; then SUCCESS_COUNT=$((SUCCESS_COUNT + 1)); fi
        
        echo "Jobs bem-sucedidos: $SUCCESS_COUNT/$TOTAL_JOBS"
        
        if [ $SUCCESS_COUNT -eq $TOTAL_JOBS ]; then
          echo "🎉 Todas as validações passaram!"
          exit 0
        else
          echo "⚠️ Algumas validações falharam"
          exit 1
        fi 