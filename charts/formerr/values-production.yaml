# Production environment overrides
backend:
  replicaCount: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  env:
    FRONTEND_SUCCESS_URL: "https://formerr.example.com/auth/success"
    FRONTEND_ERROR_URL: "https://formerr.example.com/auth/error"
    OAUTH_CALLBACK_URL: "https://api.formerr.example.com/auth/github/callback"
    ALLOWED_ORIGINS: "https://formerr.example.com"

frontend:
  replicaCount: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  env:
    NEXT_PUBLIC_API_URL: "https://api.formerr.example.com"

ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  
  hosts:
    - host: formerr.example.com
      paths:
        - path: /(.*)
          pathType: Prefix
          service: frontend
    - host: api.formerr.example.com
      paths:
        - path: /(.*)
          pathType: Prefix
          service: backend

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

monitoring:
  enabled: true
