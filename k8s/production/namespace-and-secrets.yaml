---
# Namespace for Formerr application
apiVersion: v1
kind: Namespace
metadata:
  name: formerr
  labels:
    name: formerr
    environment: production
    monitoring: enabled

---
# Database Secret (values will be filled by GitHub Actions)
apiVersion: v1
kind: Secret
metadata:
  name: formerr-db-secret
  namespace: formerr
  labels:
    app: formerr
    environment: production
type: Opaque
data:
  DATABASE_URL: ""  # Will be populated by GitHub Actions

---
# Application Secrets (values will be filled by GitHub Actions)
apiVersion: v1
kind: Secret
metadata:
  name: formerr-app-secret
  namespace: formerr
  labels:
    app: formerr
    environment: production
type: Opaque
data:
  GITHUB_CLIENT_ID: ""     # Will be populated by GitHub Actions
  GITHUB_CLIENT_SECRET: "" # Will be populated by GitHub Actions
  JWT_SECRET: ""           # Will be populated by GitHub Actions
  SESSION_SECRET: ""       # Will be populated by GitHub Actions

---
# Registry Secret for DigitalOcean Container Registry
apiVersion: v1
kind: Secret
metadata:
  name: formerr-registry-secret
  namespace: formerr
  labels:
    app: formerr
    environment: production
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""  # Will be populated by GitHub Actions

---
# TLS Secret for SSL certificates (managed by Traefik)
apiVersion: v1
kind: Secret
metadata:
  name: formerr-tls
  namespace: formerr
  labels:
    app: formerr
    environment: production
    managed-by: traefik
type: kubernetes.io/tls
# Data will be automatically populated by Traefik Let's Encrypt

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: formerr-config
  namespace: formerr
  labels:
    app: formerr
    environment: production
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  HEALTH_CHECK_ENABLED: "true"
  CORS_ORIGINS: "https://formerr.tech,https://api.formerr.tech"
  SESSION_TIMEOUT: "3600"
  MAX_REQUESTS_PER_MINUTE: "100"
  API_RATE_LIMIT: "1000"
  
---
# Resource Quota for namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: formerr-quota
  namespace: formerr
  labels:
    app: formerr
    environment: production
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
    pods: "20"

---
# Limit Range for resource constraints
apiVersion: v1
kind: LimitRange
metadata:
  name: formerr-limits
  namespace: formerr
  labels:
    app: formerr
    environment: production
spec:
  limits:
  - default:
      memory: "512Mi"
      cpu: "500m"
    defaultRequest:
      memory: "256Mi"
      cpu: "250m"
    max:
      memory: "1Gi"
      cpu: "1"
    min:
      memory: "128Mi"
      cpu: "100m"
    type: Container
  - default:
      storage: "10Gi"
    max:
      storage: "100Gi"
    min:
      storage: "1Gi"
    type: PersistentVolumeClaim

---
# Service Account for the application
apiVersion: v1
kind: ServiceAccount
metadata:
  name: formerr-app
  namespace: formerr
  labels:
    app: formerr
    environment: production
automountServiceAccountToken: false

---
# RBAC Role for the application (minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: formerr-app-role
  namespace: formerr
  labels:
    app: formerr
    environment: production
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
# RBAC RoleBinding for the application
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: formerr-app-binding
  namespace: formerr
  labels:
    app: formerr
    environment: production
subjects:
- kind: ServiceAccount
  name: formerr-app
  namespace: formerr
roleRef:
  kind: Role
  name: formerr-app-role
  apiGroup: rbac.authorization.k8s.io
