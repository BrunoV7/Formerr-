---
# Production Backend Deployment with enhanced monitoring and health checks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formerr-backend
  namespace: formerr
  labels:
    app: formerr-backend
    environment: production
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: formerr-backend
  template:
    metadata:
      labels:
        app: formerr-backend
        environment: production
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: formerr-registry-secret
      containers:
      - name: backend
        image: registry.digitalocean.com/formerr-production/formerr-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: formerr-db-secret
              key: DATABASE_URL
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: GITHUB_CLIENT_SECRET
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: JWT_SECRET
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: SESSION_SECRET
        - name: FRONTEND_SUCCESS_URL
          value: "https://formerr.tech/auth/success"
        - name: FRONTEND_ERROR_URL
          value: "https://formerr.tech/auth/error"
        - name: OAUTH_CALLBACK_URL
          value: "https://api.formerr.tech/auth/github/callback"
        - name: ALLOWED_ORIGINS
          value: "https://formerr.tech,https://api.formerr.tech"
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Production Backend Service with enhanced configuration
apiVersion: v1
kind: Service
metadata:
  name: formerr-backend-service
  namespace: formerr
  labels:
    app: formerr-backend
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: formerr-backend
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: http
  type: ClusterIP
  sessionAffinity: None

---
# Production Backend HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: formerr-backend-hpa
  namespace: formerr
  labels:
    app: formerr-backend
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: formerr-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
# Backend NetworkPolicy for enhanced security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: formerr-backend-netpol
  namespace: formerr
  labels:
    app: formerr-backend
    environment: production
spec:
  podSelector:
    matchLabels:
      app: formerr-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: traefik
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: formerr-frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - {} # Allow all egress for database and external API calls
