apiVersion: apps/v1
kind: Deployment
metadata:
  name: formerr-frontend
  namespace: formerr
  labels:
    app: formerr-frontend
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: formerr-frontend
  template:
    metadata:
      labels:
        app: formerr-frontend
    spec:
      imagePullSecrets:
      - name: formerr-registry-secret
      containers:
      - name: frontend
        image: registry.digitalocean.com/formerr/formerr-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://formerr-backend-service.formerr.svc.cluster.local:8000"
        - name: INTERNAL_API_URL
          value: "http://formerr-backend-service.formerr.svc.cluster.local:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: formerr-frontend-service
  namespace: formerr
  labels:
    app: formerr-frontend
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "formerr-frontend-lb"
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-health-check-path: "/"
    service.beta.kubernetes.io/do-loadbalancer-health-check-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-size-slug: "lb-small"
spec:
  selector:
    app: formerr-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
    name: http
  - protocol: TCP
    port: 443
    targetPort: 3000
    name: https
  type: LoadBalancer
