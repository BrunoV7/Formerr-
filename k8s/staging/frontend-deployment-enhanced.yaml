---
# Enhanced Staging Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formerr-frontend
  namespace: formerr
  labels:
    app: formerr-frontend
    environment: staging
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: formerr-frontend
  template:
    metadata:
      labels:
        app: formerr-frontend
        environment: staging
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      imagePullSecrets:
      - name: formerr-registry-secret
      containers:
      - name: frontend
        image: registry.digitalocean.com/formerr-staging/formerr-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api-staging.formerr.tech"
        - name: NODE_ENV
          value: "development"
        - name: ENVIRONMENT
          value: "staging"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Staging Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: formerr-frontend-service
  namespace: formerr
  labels:
    app: formerr-frontend
    environment: staging
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/api/metrics"
spec:
  selector:
    app: formerr-frontend
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: http
  type: ClusterIP
  sessionAffinity: None
