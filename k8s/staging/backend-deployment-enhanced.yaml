---
# Enhanced Staging Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formerr-backend
  namespace: formerr
  labels:
    app: formerr-backend
    environment: staging
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: formerr-backend
  template:
    metadata:
      labels:
        app: formerr-backend
        environment: staging
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: formerr-registry-secret
      containers:
      - name: backend
        image: registry.digitalocean.com/formerr-staging/formerr-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: formerr-db-secret
              key: DATABASE_URL
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: GITHUB_CLIENT_SECRET
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: JWT_SECRET
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: formerr-app-secret
              key: SESSION_SECRET
        - name: FRONTEND_SUCCESS_URL
          value: "https://staging.formerr.tech/auth/success"
        - name: FRONTEND_ERROR_URL
          value: "https://staging.formerr.tech/auth/error"
        - name: OAUTH_CALLBACK_URL
          value: "https://api-staging.formerr.tech/auth/github/callback"
        - name: ALLOWED_ORIGINS
          value: "https://staging.formerr.tech,https://api-staging.formerr.tech"
        - name: ENVIRONMENT
          value: "staging"
        - name: LOG_LEVEL
          value: "debug"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Staging Backend Service
apiVersion: v1
kind: Service
metadata:
  name: formerr-backend-service
  namespace: formerr
  labels:
    app: formerr-backend
    environment: staging
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: formerr-backend
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: http
  type: ClusterIP
  sessionAffinity: None
